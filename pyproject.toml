[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "pixelagent"
version = "0.1.6"
description = "A Pixeltable-native agent framework for OpenAI, Anthropic, AWS Bedrock and Google Gemini"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "Pixeltable, Inc.", email = "contact@pixeltable.com" }]
keywords = [
    "data-science", "machine-learning", "database", "ai", "computer-vision",
    "chatbot", "ml", "artificial-intelligence", "feature-engineering", "multimodal",
    "mlops", "feature-store", "vector-database", "llm", "genai"
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pixeltable>=0.7.6,<0.8",
]

[project.urls]
homepage = "https://pixeltable.com/"
repository = "https://github.com/pixeltable/pixelagent"
documentation = "https://docs.pixeltable.com/docs/libraries/pixelagent"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.7",
    # Provider SDKs: the keyless smoke suite imports all four agent modules.
    "openai>=1.0",
    "anthropic>=0.40",
    "boto3>=1.35",
    "google-genai>=1.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly: ruff's implicit default set changes between releases, and the
# `test` job installs whatever ruff uv resolves. This is a correctness gate
# (undefined names, unused imports, syntax) plus import order, not a style rewrite.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Inside a TableModel class body, an annotated name becomes a class attribute
# that later lines in the same body reference (`prompt = spec.build_prompt(
# system_prompt, ...)`). Ruff reads those as undefined names. They are not:
# the schema builds and the keyless suite exercises every one of them.
"pixelagent/core/schema.py" = ["F821"]
