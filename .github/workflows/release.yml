name: Release

# Publishing is a tag push:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# No token anywhere. PyPI Trusted Publishing mints a short-lived credential from
# this workflow's OIDC identity, so there is no long-lived PYPI_API_KEY to leak,
# rotate, or paste into a shell. The previous scripts/release.sh read one out of
# ~/.pixeltable/config.toml.
#
# One-time setup on PyPI (Manage project -> Publishing -> Add a pending publisher):
#   owner: pixeltable   repository: pixelagent
#   workflow: release.yml   environment: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version in pyproject.toml must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag pyproject=$pyproject"
          if [ "$tag" != "$pyproject" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml version $pyproject."
            exit 1
          fi

      - run: uv build

      - name: Check the artifacts
        run: |
          uv tool run twine check dist/*
          ls -la dist/

      # A release that cannot be installed is worse than no release. This is the
      # same check that caught the 0.1.x breakage: install the actual artifact
      # against the newest pixeltable our bound allows, then build an agent.
      - name: Install the built wheel and smoke-test it
        env:
          PIXELTABLE_HOME: ${{ runner.temp }}/pxt-release
        run: |
          uv venv /tmp/verify --python 3.12
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl openai
          VIRTUAL_ENV=/tmp/verify uv pip list | grep -E "pixelagent|pixeltable"
          /tmp/verify/bin/python -c "
          import datetime, pixeltable as pxt
          from pixelagent.openai import Agent
          Agent(name='release_check', system_prompt='hi', reset=True)
          t = pxt.get_table('release_check.agent')
          assert 'agent_response' in t.columns(), t.columns()
          print('built wheel installs and builds an agent')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    # The environment gives you a required-reviewer gate if you want one:
    # Settings -> Environments -> pypi -> Required reviewers.
    environment:
      name: pypi
      url: https://pypi.org/p/pixelagent
    permissions:
      id-token: write # mints the OIDC token Trusted Publishing exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
