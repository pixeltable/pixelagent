name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC. Catches a breaking Pixeltable release even when
    # nobody has pushed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The reproducible build: exactly the dependency set in uv.lock.
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check pixelagent tests

      - name: Test (keyless)
        run: uv run pytest tests/ -m "not live" -v

  # The point of this file. Installs the newest published Pixeltable, ignoring the
  # lockfile and the `<0.8` pin, then runs the keyless suite against it. A breaking
  # Pixeltable release turns this red on the day it ships instead of turning up in
  # a user's traceback. It is allowed to fail the build; it is not allowed to be
  # silent.
  canary-unpinned:
    name: canary (unpinned pixeltable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install newest pixeltable, then pixelagent without its pin
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pixeltable openai anthropic boto3 google-genai pytest
          pip install -e . --no-deps
          python -c "import pixeltable; print('pixeltable', pixeltable.__version__)"

      - name: Smoke test (keyless)
        run: pytest tests/test_smoke.py -v

  # Real API calls. Never runs on a pull request, so fork PRs never need secrets.
  live:
    name: live (real API calls)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --group dev --python 3.12

      - name: Test (live)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
        # Each test is skipif-guarded on its own key, so a missing secret skips
        # that provider rather than failing the job.
        run: uv run pytest tests/ -m live -v
